name: FindHub Android
options:
  bundleIdPrefix: pl.mintstudio.findhubandroid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: "1.28.2"
targets:
  FindHubAndroidAppearanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AppearanceTests.swift
      - Tests/JournalViewTests.swift
      - Tests/PlacesViewTests.swift
      - Tests/TabBarTests.swift
    dependencies:
      - target: FindHub Android
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FindHub Android:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - Sources
      - Resources
    dependencies:
      - package: SwiftProtobuf
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Opt the whole app out of iOS 26 "Liquid Glass" — keep a solid Material look.
        UIDesignRequiresCompatibility: true
        # Publisher and public GPL source location shown in Settings.
        FHASourceCodeURL: $(SOURCE_CODE_URL)
        FHAPublisher: $(PUBLISHER_NAME)
        FHAPublisherContact: $(PUBLISHER_CONTACT)
        UIBackgroundModes:
          - bluetooth-central
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - pl.mintstudio.findhubandroid.journal-refresh
    settings:
      base:
        PRODUCT_NAME: "FindHub Android"
        SOURCE_CODE_URL: "https://github.com/darthkubox/FindHub-Android"
        PUBLISHER_NAME: "mintstudio"
        PUBLISHER_CONTACT: "kontakt@mintstudio.pl"
        PRODUCT_MODULE_NAME: FindHubAndroid
        PRODUCT_BUNDLE_IDENTIFIER: pl.mintstudio.findhubandroid
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "FindHub Android"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "FindHub Android używa Bluetooth do namierzania i powiadamiania o utracie kontaktu z Twoimi tagami."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "FindHub Android pokazuje Twoją pozycję i pozwala zaznaczyć obszar domu lub pracy."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Sources/uECC/Bridging.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/uECC
schemes:
  FindHub Android:
    build:
      targets:
        FindHub Android: all
    test:
      targets:
        - FindHubAndroidAppearanceTests
