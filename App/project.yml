name: Tagpin
options:
  bundleIdPrefix: pl.mintstudio.tagpin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pl
settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: "1.28.2"
targets:
  TagpinAppearanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AppearanceTests.swift
      - Tests/JournalViewTests.swift
      - Tests/PlacesViewTests.swift
      - Tests/TabBarTests.swift
      - Tests/LegalTests.swift
      - Tests/ScrollInsetTests.swift
      - Tests/DemoModeTests.swift
    dependencies:
      - target: Tagpin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  Tagpin:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - Sources
      - Resources
    dependencies:
      - package: SwiftProtobuf
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Source strings are Polish, but languages without a translation fall back to English.
        CFBundleDevelopmentRegion: en
        # Opt the whole app out of iOS 26 "Liquid Glass" — keep a solid Material look.
        UIDesignRequiresCompatibility: true
        # Publisher and public GPL source location shown in Settings.
        FHASourceCodeURL: $(SOURCE_CODE_URL)
        FHAPublisher: $(PUBLISHER_NAME)
        FHAPublisherContact: $(PUBLISHER_CONTACT)
        UIBackgroundModes:
          - bluetooth-central
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - pl.mintstudio.tagpin.journal-refresh
    settings:
      base:
        PRODUCT_NAME: "Tagpin"
        SOURCE_CODE_URL: "https://github.com/darthkubox/Tagpin"
        PUBLISHER_NAME: "mintstudio"
        PUBLISHER_CONTACT: "kontakt@mintstudio.pl"
        PRODUCT_MODULE_NAME: Tagpin
        PRODUCT_BUNDLE_IDENTIFIER: pl.mintstudio.tagpin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Tagpin"
        # Strings are authored in Polish; languages without a translation fall back to English.
        DEVELOPMENT_LANGUAGE: en
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Tagpin używa Bluetooth do namierzania i powiadamiania o utracie kontaktu z Twoimi tagami."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Tagpin pokazuje Twoją pozycję i pozwala zaznaczyć obszar domu lub pracy."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Sources/uECC/Bridging.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/uECC
schemes:
  Tagpin:
    build:
      targets:
        Tagpin: all
    test:
      targets:
        - TagpinAppearanceTests
